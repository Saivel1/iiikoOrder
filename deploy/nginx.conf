# Шаблон: server_setup.sh подставляет __DOMAIN__ и кладёт в /etc/nginx/sites-available/iikoweb.
# HTTPS (listen 443, сертификат, редирект с http) дописывает certbot --nginx.

# Ограничение частоты запросов к API с одного IP: защита от перебора и случайного флуда
limit_req_zone $binary_remote_addr zone=iikoweb_api:10m rate=10r/s;

# В логах без query-строки: в ссылке бариста лежит ключ
log_format iikoweb_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

# Запросы по IP или на чужие домены — молча закрываем, наружу торчит только наш домен
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    access_log /var/log/nginx/iikoweb.access.log iikoweb_noquery;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        limit_req zone=iikoweb_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/iikoweb_proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/iikoweb_proxy.conf;
    }
}
