<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бар — Брутто</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #ec1c24; --text: #212121; --muted: #7a7a7a; --bg: #ececec; --card: #ffffff; --line: #e8e8e8; --ok: #1f9d55; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overflow-x: clip; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 Montserrat, -apple-system, BlinkMacSystemFont, sans-serif; }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); box-shadow: 0 1px 0 var(--line); }
  header .in { max-width: 720px; margin: 0 auto; padding: 14px 16px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; }
  .kassa { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .kassa::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #bdbdbd; }
  .kassa.on { color: var(--ok); }
  .kassa.on::before { background: var(--ok); }
  .kassa.off { color: var(--primary); }
  .kassa.off::before { background: var(--primary); }
  .ghost:disabled { opacity: .6; cursor: default; }
  .ghost { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .search { margin-top: 10px; width: 100%; font: inherit; padding: 10px 14px; border-radius: 12px; border: 0; background: var(--bg); outline: none; }
  main { max-width: 720px; margin: 0 auto; padding: 8px 16px 40px; }

  /* касса офлайн и заказы, которые до неё не дошли */
  .alert { background: var(--primary); color: #fff; border-radius: 16px; padding: 14px 16px; margin-top: 14px; font-weight: 600; }
  .alert small { display: block; font-weight: 500; opacity: .85; margin-top: 4px; }
  .problems h2 { font-size: 16px; margin: 20px 0 8px; color: var(--primary); }
  .problem { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; border-left: 5px solid var(--primary); }
  .problem .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 18px; }
  .problem .head span { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .problem .who { margin-top: 2px; }
  .problem ul { margin: 8px 0; padding-left: 18px; }
  .problem .mods { color: var(--muted); font-size: 14px; }
  .problem .comment { background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .problem .err { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .problem .actions { display: flex; gap: 8px; margin-top: 12px; }
  .problem .actions button { flex: 1; padding: 12px; border-radius: 12px; border: 0; font-weight: 700; font-size: 15px; cursor: pointer; }
  .done { background: var(--text); color: #fff; }
  .retry { background: var(--bg); color: var(--text); }

  h3 { margin: 22px 0 8px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .list { background: var(--card); border-radius: 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .name { flex: 1; min-width: 0; cursor: pointer; }
  .item .price { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .item.off .name { color: var(--muted); }
  .item.off .state { display: inline; }
  /* остаток: пусто — без ограничения */
  .stock { width: 64px; flex: none; font: inherit; font-size: 15px; text-align: center; padding: 6px 4px; border-radius: 10px; border: 2px solid transparent; background: var(--bg); outline: none; }
  .stock { appearance: textfield; -moz-appearance: textfield; }
  .stock::-webkit-inner-spin-button, .stock::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stock:focus { border-color: var(--primary); background: var(--card); }
  .stock.low { color: var(--primary); font-weight: 700; }
  .state { display: none; color: var(--primary); font-size: 12px; font-weight: 700; margin-left: 6px; }

  /* переключатель */
  .switch { position: relative; width: 50px; height: 30px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: #c9c9c9; border-radius: 999px; transition: .15s; }
  .switch span::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .error { color: var(--primary); padding: 40px 0; text-align: center; }

  /* окно мастер-пароля */
  .modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 10; display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--card); border-radius: 20px; padding: 22px; width: 100%; max-width: 380px; }
  .modal h2 { margin: 0 0 6px; font-size: 20px; }
  .modal p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .modal input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid transparent; background: var(--bg); outline: none; }
  .modal input:focus { border-color: var(--primary); background: var(--card); }
  .modal .row { display: flex; gap: 8px; margin-top: 14px; }
  .modal .row button { flex: 1; padding: 13px; border-radius: 12px; border: 0; font-weight: 700; font-size: 15px; cursor: pointer; }
  .modal .go { background: var(--primary); color: #fff; }
  .modal .cancel { background: var(--bg); color: var(--text); }
  .modal .msg { color: var(--primary); font-size: 14px; font-weight: 600; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <div class="in">
    <div class="top">
      <h1>Бар</h1>
      <span class="kassa hidden" id="kassa"></span>
      <button class="ghost" id="sync">Обновить меню</button>
      <button class="ghost" id="qr-open">QR-коды</button>
    </div>
    <div class="sub" id="sub">Выключите позицию — она сразу пропадёт у гостей.</div>
    <div class="sub">Число у позиции — сколько осталось: заказы его уменьшают, на нуле позиция пропадает. Пусто — без ограничения.</div>
    <input class="search" id="search" type="search" placeholder="Найти позицию…">
  </div>
</header>
<main>
  <div id="alert"></div>
  <div class="problems" id="problems"></div>
  <div id="list"></div>
</main>

<div class="modal-bg hidden" id="qr-modal">
  <form class="modal" id="qr-form">
    <h2>QR-коды столов</h2>
    <p>Лист для печати со всеми столами. Введите мастер-пароль.</p>
    <input id="qr-password" type="password" autocomplete="current-password" placeholder="Мастер-пароль" required>
    <div class="msg" id="qr-msg"></div>
    <div class="row">
      <button type="button" class="cancel" id="qr-cancel">Отмена</button>
      <button class="go" id="qr-go">Открыть</button>
    </div>
  </form>
</div>

<script>
const KEY = {{ key|tojson }};
const $ = (id) => document.getElementById(id);
const api = (path, opts = {}) => fetch(path + "?key=" + encodeURIComponent(KEY), {
  ...opts, headers: { "Content-Type": "application/json" },
});
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, attrs);
  node.append(...children);
  return node;
}
const rub = (n) => Math.round(n).toLocaleString("ru-RU") + " ₽";
const time = (iso) => new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

// ---------- касса и заказы, которые не дошли ----------
function renderKassa(data) {
  const k = $("kassa");
  if (!data.iiko_enabled) {
    k.className = "kassa off";
    k.textContent = "отправка в iiko выключена";
    return;
  }
  const alive = data.kassa?.alive;
  k.className = "kassa " + (alive ? "on" : alive === false ? "off" : "");
  k.textContent = alive ? "касса онлайн" : alive === false ? "касса офлайн" : "касса: нет данных";
  $("alert").replaceChildren(...(alive === false ? [el("div", { className: "alert" },
    "Касса не на связи с облаком iiko — заказы с сайта до неё не дойдут.",
    el("small", { textContent: "Перезапустите iikoFront на кассе. Гости увидят «подойдите к бариста»." }))] : []));
}

function problem(o) {
  const act = async (path, confirmText) => {
    if (confirmText && !confirm(confirmText)) return;
    const res = await api(`/api/bar/orders/${o.id}/${path}`, { method: "POST" });
    if (!res.ok) alert((await res.json()).detail || "Ошибка");
    loadOverview();
  };
  return el("div", { className: "problem" },
    el("div", { className: "head" }, o.table_name, el("span", { textContent: time(o.created_at) })),
    el("div", { className: "who", textContent: o.guest_name }),
    el("ul", {}, ...o.items.map((i) => el("li", {},
      `${i.qty} × ${i.name}`,
      i.modifiers.length ? el("div", { className: "mods", textContent: "+ " + i.modifiers.map((m) => m.name + (m.amount > 1 ? " ×" + m.amount : "")).join(", ") }) : ""))),
    o.comment ? el("div", { className: "comment", textContent: o.comment }) : "",
    el("div", { className: "err", textContent: "Причина: " + (o.iiko_error || "неизвестно") }),
    el("div", { className: "actions" },
      el("button", { className: "done", textContent: "Пробил вручную", onclick: () => act("manual") }),
      el("button", { className: "retry", textContent: "Отправить ещё раз",
        onclick: () => act("retry", "Сначала проверьте на кассе, что этого заказа там нет — иначе будет дубль. Отправить?") })),
  );
}

async function loadOverview() {
  try {
    const res = await api("/api/bar/overview");
    if (!res.ok) return;
    const data = await res.json();
    renderKassa(data);
    $("problems").replaceChildren(...(data.problems.length
      ? [el("h2", { textContent: `Не дошли до кассы: ${data.problems.length} — пробейте вручную` }), ...data.problems.map(problem)]
      : []));
  } catch {}
}

// ---------- стоп-лист ----------
let items = [];

const isOff = (m) => !m.is_available || m.stock === 0;
const LOW_STOCK = 3;

async function save(m, patch) {
  Object.assign(m, patch);
  renderSub();
  try {
    const res = await api(`/api/bar/menu/${m.id}`, { method: "PATCH", body: JSON.stringify(patch) });
    if (res.ok) return;
  } catch {}
  alert("Не удалось сохранить, попробуйте ещё раз");
  loadMenu();
}

function row(m) {
  const box = el("input", { type: "checkbox", checked: !!m.is_available });
  const state = el("span", { className: "state" });
  const stock = el("input", { className: "stock", type: "number", inputMode: "numeric", min: 0, max: 9999, placeholder: "∞",
    value: m.stock ?? "", ariaLabel: "Сколько осталось" });
  const node = el("div", { className: "item" },
    el("span", { className: "name", onclick: () => box.click() }, m.name, state),
    el("span", { className: "price", textContent: rub(m.price) }),
    stock,
    el("label", { className: "switch" }, box, el("span")),
  );
  const paint = () => {
    node.classList.toggle("off", isOff(m));
    state.textContent = !m.is_available ? "нет в наличии" : "закончилось";
    stock.classList.toggle("low", m.stock !== null && m.stock <= LOW_STOCK);
  };
  paint();
  box.onchange = () => { save(m, { is_available: box.checked }); paint(); };
  stock.onchange = () => {
    const v = stock.value.trim();
    const n = v === "" ? null : Math.max(0, Math.min(9999, Math.floor(Number(v))));
    if (Number.isNaN(n)) { stock.value = m.stock ?? ""; return; }
    stock.value = n ?? "";
    save(m, { stock: n });
    paint();
  };
  stock.onkeydown = (e) => { if (e.key === "Enter") stock.blur(); };
  return node;
}

function renderSub() {
  const off = items.filter(isOff).length;
  $("sub").textContent = off
    ? `Стоп-лист: ${off} из ${items.length}. Выключенные позиции гости не видят.`
    : "Всё в наличии. Выключите позицию — она сразу пропадёт у гостей.";
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const byCat = new Map();
  for (const m of items) {
    if (q && !m.name.toLowerCase().includes(q)) continue;
    if (!byCat.has(m.category)) byCat.set(m.category, []);
    byCat.get(m.category).push(m);
  }
  $("list").replaceChildren(...[...byCat.entries()].flatMap(([cat, list]) => [
    el("h3", { textContent: cat }),
    el("div", { className: "list" }, ...list.map(row)),
  ]));
  renderSub();
}

async function loadMenu() {
  try {
    const res = await api("/api/bar/menu");
    items = await res.json();
    render();
  } catch {
    $("list").replaceChildren(el("div", { className: "error", textContent: "Нет связи с сервером. Обновите страницу." }));
  }
}
$("search").oninput = render;

// ---------- обновить меню из iiko ----------
$("sync").onclick = async () => {
  const btn = $("sync");
  btn.disabled = true;
  btn.textContent = "Обновляю…";
  try {
    const res = await api("/api/bar/sync", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ошибка");
    btn.textContent = `Готово: ${data.items} поз.`;
    await loadMenu();
  } catch (e) {
    btn.textContent = "Обновить меню";
    alert("Не удалось обновить меню: " + (e.message || "нет связи с сервером"));
  } finally {
    btn.disabled = false;
    setTimeout(() => { btn.textContent = "Обновить меню"; }, 3000);
  }
};

// ---------- QR-коды по мастер-паролю ----------
function closeQr() { $("qr-modal").classList.add("hidden"); $("qr-password").value = ""; $("qr-msg").textContent = ""; }
$("qr-open").onclick = () => { $("qr-modal").classList.remove("hidden"); $("qr-password").focus(); };
$("qr-cancel").onclick = closeQr;
$("qr-form").onsubmit = async (e) => {
  e.preventDefault();
  // Окно открываем сразу по нажатию, иначе браузер посчитает его всплывающим и заблокирует
  const win = window.open("", "_blank");
  $("qr-go").disabled = true;
  $("qr-msg").textContent = "";
  try {
    const res = await api("/api/bar/qr", { method: "POST", body: JSON.stringify({ password: $("qr-password").value }) });
    if (!res.ok) {
      win?.close();
      $("qr-msg").textContent = (await res.json()).detail || "Ошибка";
      return;
    }
    const url = URL.createObjectURL(new Blob([await res.text()], { type: "text/html" }));
    if (win) win.location = url; else location.href = url;
    closeQr();
  } catch {
    win?.close();
    $("qr-msg").textContent = "Нет связи с сервером";
  } finally {
    $("qr-go").disabled = false;
  }
};

loadMenu();
loadOverview();
setInterval(() => {
  loadOverview();
  // Остатки уменьшаются от заказов гостей; не перерисовываем, пока бариста вводит число
  if (!document.activeElement?.classList.contains("stock")) loadMenu();
}, 20000);
</script>
</body>
</html>
